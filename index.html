<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real SMS Verification Client</title>
    <style>
      :root { --bg:#0f172a; --panel:#111827; --text:#f8fafc; --muted:#94a3b8; --border:#334155; --ok:#22c55e; --warn:#f59e0b; --err:#f87171; }
      *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top right,#1d4ed8 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding:1rem}
      .layout{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:350px 1fr;gap:1rem}.panel{border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,black 8%);padding:1rem}
      h1,h2,h3{margin:0 0 .5rem}.muted{color:var(--muted);font-size:.9rem}.small{font-size:.82rem}
      .number-list{display:grid;gap:.55rem;margin-top:.75rem}.number-card{border:1px solid #475569;border-radius:10px;background:#0b1223;padding:.55rem}.number-card.active{border-color:var(--ok);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent 55%)}
      .number-row{display:flex;gap:.5rem;align-items:center}.pick-btn{flex:1;border:1px solid #475569;background:#111827;color:var(--text);border-radius:8px;padding:.45rem .55rem;cursor:pointer;font-weight:700;text-align:left}
      .refresh-btn{border:1px solid #475569;background:#1e293b;color:#cbd5e1;border-radius:8px;padding:.45rem .55rem;cursor:pointer;font-weight:700}
      label{display:block;margin:.7rem 0 .3rem;font-size:.92rem}input{width:100%;border:1px solid #475569;background:#0b1223;color:var(--text);border-radius:10px;padding:.65rem .75rem}
      .row{display:flex;gap:.55rem;margin-top:.7rem}button{border:0;border-radius:10px;padding:.65rem .8rem;font-weight:700;cursor:pointer}.primary{background:linear-gradient(180deg,#22c55e,#16a34a);color:#052e12}.secondary{background:#334155;color:#f8fafc}
      .status{min-height:1.3rem;margin-top:.7rem;font-size:.95rem}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
      .messages{margin-top:.75rem;display:grid;gap:.55rem;max-height:360px;overflow:auto}.message{border:1px solid var(--border);border-radius:10px;padding:.6rem;background:#0b1223}.code{margin-top:.35rem;display:inline-block;padding:.2rem .45rem;border-radius:8px;border:1px dashed #475569;background:#111827;font-family:ui-monospace,monospace}.time{font-size:.75rem;color:var(--muted);margin-top:.3rem}
      @media (max-width:920px){.layout{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>Real Phone Numbers</h1>
        <p class="muted">Loads numbers from your backend API. Refresh each number independently.</p>

        <label for="apiBase">API base URL</label>
        <input id="apiBase" type="url" />
        <p class="muted small" id="apiHint"></p>
        <div class="row">
          <button id="loadNumbers" class="secondary" type="button">Connect & load numbers</button>
        </div>

        <div id="numberList" class="number-list"></div>
        <p id="selectedText" class="muted">Selected: none</p>
      </aside>

      <main class="panel">
        <h2>Verification Actions</h2>
        <p class="muted">Uses your backend endpoints only (no fake OTP generation).</p>

        <label for="phoneField">Selected phone number</label>
        <input id="phoneField" type="tel" readonly placeholder="Load and select a phone number" />

        <label for="codeInput">Verification code</label>
        <input id="codeInput" inputmode="numeric" maxlength="10" placeholder="Enter code received by SMS" />

        <div class="row">
          <button id="requestBtn" class="primary" type="button">Request verification SMS</button>
          <button id="verifyBtn" class="secondary" type="button">Verify code</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <h3>Inbox for selected number</h3>
        <p class="muted">Fetched from <code>GET /messages?phone=...</code>.</p>
        <div id="messages" class="messages"></div>
      </main>
    </div>

    <script>
      const apiBaseInput = document.getElementById('apiBase');
      const apiHint = document.getElementById('apiHint');
      const loadNumbersBtn = document.getElementById('loadNumbers');
      const numberListEl = document.getElementById('numberList');
      const selectedTextEl = document.getElementById('selectedText');
      const phoneFieldEl = document.getElementById('phoneField');
      const codeInputEl = document.getElementById('codeInput');
      const statusEl = document.getElementById('status');
      const messagesEl = document.getElementById('messages');
      const requestBtn = document.getElementById('requestBtn');
      const verifyBtn = document.getElementById('verifyBtn');

      const defaultBase = `${window.location.origin}/api`;
      apiBaseInput.value = localStorage.getItem('smsApiBase') || defaultBase;
      apiHint.textContent = `Tip: if backend runs on same host use ${defaultBase}`;

      let numbers = [];
      let selectedNumber = null;

      function setStatus(text, type = 'ok') {
        statusEl.textContent = text;
        statusEl.className = `status ${type}`;
      }

      function getApiBase() {
        return apiBaseInput.value.trim().replace(/\/$/, '');
      }

      function networkHint() {
        return 'Check API URL, backend availability, HTTPS/mixed-content, and CORS (Access-Control-Allow-Origin).';
      }

      async function apiRequest(path, options = {}) {
        const base = getApiBase();
        const url = `${base}${path}`;

        let res;
        try {
          res = await fetch(url, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options
          });
        } catch (err) {
          throw new Error(`NetworkError contacting ${url}. ${networkHint()}`);
        }

        let data = null;
        try { data = await res.json(); } catch { data = null; }

        if (!res.ok) {
          const message = data?.error || data?.message || `HTTP ${res.status}`;
          throw new Error(message);
        }
        return data;
      }

      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function renderNumbers() {
        numberListEl.innerHTML = '';
        if (!numbers.length) {
          numberListEl.innerHTML = '<div class="number-card muted">No numbers loaded.</div>';
          return;
        }

        numbers.forEach((phone, index) => {
          const card = document.createElement('div');
          card.className = 'number-card';
          card.dataset.number = phone;

          const row = document.createElement('div');
          row.className = 'number-row';

          const pickBtn = document.createElement('button');
          pickBtn.type = 'button';
          pickBtn.className = 'pick-btn';
          pickBtn.textContent = phone;
          pickBtn.addEventListener('click', () => selectNumber(phone));

          const refreshBtn = document.createElement('button');
          refreshBtn.type = 'button';
          refreshBtn.className = 'refresh-btn';
          refreshBtn.textContent = 'Refresh';
          refreshBtn.addEventListener('click', () => refreshInbox(phone));

          row.appendChild(pickBtn);
          row.appendChild(refreshBtn);
          card.appendChild(row);
          numberListEl.appendChild(card);

          if (index === 0 && !selectedNumber) selectNumber(phone);
        });

        if (selectedNumber) {
          document.querySelectorAll('.number-card').forEach((card) => {
            card.classList.toggle('active', card.dataset.number === selectedNumber);
          });
        }
      }

      function selectNumber(phone) {
        selectedNumber = phone;
        selectedTextEl.textContent = `Selected: ${phone}`;
        phoneFieldEl.value = phone;
        document.querySelectorAll('.number-card').forEach((card) => {
          card.classList.toggle('active', card.dataset.number === phone);
        });
        refreshInbox(phone);
      }

      async function loadNumbers() {
        try {
          const base = getApiBase();
          localStorage.setItem('smsApiBase', base);
          setStatus(`Connecting to ${base}...`, 'warn');

          const data = await apiRequest('/numbers');
          if (!Array.isArray(data?.numbers)) throw new Error('Invalid response: expected { numbers: string[] }');

          numbers = data.numbers;
          if (!numbers.includes(selectedNumber)) selectedNumber = numbers[0] || null;
          renderNumbers();
          setStatus(`Loaded ${numbers.length} phone number(s).`, 'ok');

          if (selectedNumber) refreshInbox(selectedNumber);
          else messagesEl.innerHTML = '<div class="message muted">No selected number.</div>';
        } catch (err) {
          setStatus(`Failed to load numbers: ${err.message}`, 'err');
        }
      }

      async function refreshInbox(phone = selectedNumber) {
        if (!phone) {
          setStatus('Select a number first.', 'warn');
          return;
        }

        try {
          setStatus(`Refreshing inbox for ${phone}...`, 'warn');
          const data = await apiRequest(`/messages?phone=${encodeURIComponent(phone)}`);
          if (!Array.isArray(data?.messages)) throw new Error('Invalid response: expected { messages: [...] }');

          messagesEl.innerHTML = '';
          if (!data.messages.length) {
            messagesEl.innerHTML = '<div class="message muted">No messages found for this number.</div>';
          } else {
            data.messages.slice().reverse().forEach((msg) => {
              const item = document.createElement('div');
              item.className = 'message';
              item.innerHTML = `
                <div><strong>${msg.from || 'Verification Service'}</strong> → ${phone}</div>
                <div>${msg.text || ''}</div>
                ${msg.code ? `<div class="code">Code: ${msg.code}</div>` : ''}
                <div class="time">${formatTime(msg.time || Date.now())}</div>
              `;
              messagesEl.appendChild(item);
            });
          }

          setStatus(`Inbox refreshed for ${phone}.`, 'ok');
        } catch (err) {
          setStatus(`Failed to refresh inbox: ${err.message}`, 'err');
        }
      }

      async function requestVerification() {
        if (!selectedNumber) {
          setStatus('Select a phone number first.', 'warn');
          return;
        }

        try {
          setStatus(`Requesting verification SMS for ${selectedNumber}...`, 'warn');
          await apiRequest('/verification/request', {
            method: 'POST',
            body: JSON.stringify({ phone: selectedNumber })
          });
          setStatus(`Verification SMS requested for ${selectedNumber}. Click Refresh on that number.`, 'ok');
        } catch (err) {
          setStatus(`Failed to request SMS: ${err.message}`, 'err');
        }
      }

      async function verifyCode() {
        if (!selectedNumber) {
          setStatus('Select a phone number first.', 'warn');
          return;
        }

        const code = codeInputEl.value.trim();
        if (!code) {
          setStatus('Enter the verification code first.', 'warn');
          return;
        }

        try {
          setStatus('Verifying code...', 'warn');
          const result = await apiRequest('/verification/confirm', {
            method: 'POST',
            body: JSON.stringify({ phone: selectedNumber, code })
          });

          if (result?.verified) setStatus('✅ Code verified successfully.', 'ok');
          else setStatus('Verification failed: backend returned not verified.', 'err');
        } catch (err) {
          setStatus(`Failed to verify code: ${err.message}`, 'err');
        }
      }

      loadNumbersBtn.addEventListener('click', loadNumbers);
      requestBtn.addEventListener('click', requestVerification);
      verifyBtn.addEventListener('click', verifyCode);

      // No auto-fetch to avoid immediate NetworkError when backend isn't up yet.
      renderNumbers();
    </script>
  </body>
</html>
